name: Deploy CyberChef to GitHub Pages

on:
  push:
    branches:
    - main
    paths:
    - version
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Download cyberchef release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cc_version="$(cat version | xargs)"
        gh release download "$cc_version" \
          --repo gchq/CyberChef \
          --pattern "CyberChef_$cc_version.zip" \
          --output cyberchef.zip
        mkdir dist
        unzip cyberchef.zip -d dist
        mv dist/CyberChef_*.html dist/index.html
    - name: Inject CSP Meta Tag
      run: |
        CSP_TAG="<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src data:; worker-src blob:; connect-src https:;\">"
        sed -i "s|<head>|<head>${CSP_TAG}|" dist/index.html
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./dist
    - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
